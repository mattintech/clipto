[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clipto"
version = "0.3.2"
description = "Instant clipboard, screenshot, and file bridge from your browser to your terminal/remote server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Matt Hills" }
]
maintainers = [
    { name = "mattintech", email = "mattintech@gmail.com" }
]
keywords = [
    "clipboard",
    "screenshot",
    "upload",
    "cli",
    "developer-tools",
    "ai-tools",
    "remote-transfer"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
qr = ["segno>=1.6.0"]
dev = [
    "pytest>=8.0.0",
    "build>=1.0.0",
    "twine>=5.0.0",
]

[project.scripts]
clipto = "clipto.cli:main"

[project.urls]
Homepage = "https://github.com/mattintech/clipto"
Repository = "https://github.com/mattintech/clipto"
Issues = "https://github.com/mattintech/clipto/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/clipto"]
