<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clipto — Fast Clipboard & File Bridge</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><path d='M19 3h-4.18C14.4 1.84 13.3 1 12 1c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 16H5V5h2v2h10V5h2v14z'/></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="brand-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path>
            <rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect>
          </svg>
        </div>
        <span class="brand-name">Clipto</span>
      </div>

      <div class="context-badges">
        <div id="session-title" class="badge title-badge hidden"></div>
        <div class="badge host-badge" title="Host Machine">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
          <span id="hostname-display">Connecting...</span>
        </div>
        <div class="badge dir-badge" title="Destination Directory">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
          <span id="dir-display">...</span>
        </div>
        <div id="connection-status" class="status-pill online">
          <span class="dot"></span>
          <span class="status-text">Ready</span>
        </div>
      </div>
    </header>

    <!-- Main Dropzone / Paste Area -->
    <main class="main-content">
      <div id="dropzone" class="dropzone">
        <div class="dropzone-content">
          <div class="paste-icon-wrap">
            <svg class="paste-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
          </div>

          <h2 class="dropzone-title">
            Press <kbd class="kbd">Cmd</kbd> + <kbd class="kbd">V</kbd> anywhere to paste
          </h2>
          <p class="dropzone-subtitle">or drag and drop screenshots, images, logs, or files here</p>

          <div class="actions">
            <label class="btn btn-primary" for="file-input">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
              Browse Files
            </label>
            <input type="file" id="file-input" multiple style="display: none;">
          </div>
        </div>

        <div class="drop-overlay">
          <div class="drop-overlay-content">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
            <h3>Drop to Upload</h3>
          </div>
        </div>
      </div>

      <!-- Optional Note / Text Area -->
      <div class="note-section card">
        <div class="note-header">
          <div class="note-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <span>Send Text / Note / Stack Trace</span>
          </div>
          <button id="btn-send-note" class="btn btn-secondary btn-sm" disabled>Send Text</button>
        </div>
        <textarea id="note-input" class="note-input" placeholder="Paste or type text, error logs, or notes to save into the directory..."></textarea>
      </div>

      <!-- Recent Uploads / Session History -->
      <div class="uploads-section card">
        <div class="uploads-header">
          <h3>Recent Uploads</h3>
          <span id="upload-count" class="badge">0 items</span>
        </div>
        <div id="uploads-list" class="uploads-list">
          <div class="empty-state">No files uploaded yet in this session.</div>
        </div>
      </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
